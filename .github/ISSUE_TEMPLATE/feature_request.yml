name: Feature request
description: Suggest an improvement or a new tool
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or task, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: This doesn't add network destinations, telemetry or third-party services.
          required: true
